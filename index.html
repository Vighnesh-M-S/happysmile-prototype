<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Clickable prototype of an AI voice assistant for HappySmile, a fictional chain of dental clinics.">
<title>HappySmile Voice Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Layout: Patient view = one centred phone card; Clinic view = sidebar + lead list + detail panel */
  :root {
    --bg: #FFFFFF;
    --surface: #F4F7F7;
    --surface2: #EAF0F0;
    --line: #DCE5E4;
    --fg: #102221;
    --muted: #55696A;
    --brand: #0E9F9A;
    --brandstrong: #0A7F7B;
    --onbrand: #FFFFFF;
    --brandsoft: #E3F5F4;
    --ring: #0E9F9A;
    --ok: #166534;   --okbg: #DCFCE7;
    --warn: #8A3B0A; --warnbg: #FEF0C7;
    --neutral: #3F4C5A; --neutralbg: #EDF1F4;
    --bad: #A61B1B;  --badbg: #FDE2E2;
    --staff: #3730A3; --staffbg: #E3E7FF;
    --shadow: 0 24px 60px -24px rgba(16, 60, 58, .25), 0 2px 6px rgba(16, 60, 58, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0C1414; --surface: #142020; --surface2: #1B2A29; --line: #273837;
      --fg: #E5EFEE; --muted: #9BB0AE; --brand: #2CC2BC; --brandstrong: #3CCFC9;
      --onbrand: #04211F; --brandsoft: #12302E; --ring: #3CCFC9;
      --ok: #86EFAC; --okbg: #12301E; --warn: #FCD34D; --warnbg: #36290B;
      --neutral: #CBD5E1; --neutralbg: #222E2E; --bad: #FCA5A5; --badbg: #3A1515;
      --staff: #C7D2FE; --staffbg: #1E2446;
      --shadow: 0 24px 60px -24px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.3);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0C1414; --surface: #142020; --surface2: #1B2A29; --line: #273837;
    --fg: #E5EFEE; --muted: #9BB0AE; --brand: #2CC2BC; --brandstrong: #3CCFC9;
    --onbrand: #04211F; --brandsoft: #12302E; --ring: #3CCFC9;
    --ok: #86EFAC; --okbg: #12301E; --warn: #FCD34D; --warnbg: #36290B;
    --neutral: #CBD5E1; --neutralbg: #222E2E; --bad: #FCA5A5; --badbg: #3A1515;
    --staff: #C7D2FE; --staffbg: #1E2446;
    --shadow: 0 24px 60px -24px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.3);
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  #root { min-height: 100%; }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1, h2, h3 { text-wrap: balance; }
  .tnum { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; border-radius: 8px; }
  .shadow-phone { box-shadow: var(--shadow); }
  .ringer { position: relative; }
  .ringer::before, .ringer::after {
    content: ""; position: absolute; inset: 0; border-radius: 9999px; background: var(--brand);
    animation: ring 2.4s ease-out infinite; opacity: 0;
  }
  .ringer::after { animation-delay: 1.2s; }
  @keyframes ring { 0% { transform: scale(.95); opacity: .35; } 100% { transform: scale(1.9); opacity: 0; } }
  .fade-in { animation: fadeIn .35s ease-out both; }
  @keyframes fadeIn { from { opacity: .001; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .slide-in { animation: slideIn .25s ease-out both; }
  @keyframes slideIn { from { transform: translateX(24px); opacity: .4; } to { transform: none; opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .ringer::before, .ringer::after, .fade-in, .slide-in { animation: none !important; }
  }
  .thin-scroll { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  select { background-image: none; }
</style>

<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: "var(--bg)", surface: "var(--surface)", surface2: "var(--surface2)", line: "var(--line)",
          fg: "var(--fg)", muted: "var(--muted)", brand: "var(--brand)", brandstrong: "var(--brandstrong)",
          onbrand: "var(--onbrand)", brandsoft: "var(--brandsoft)",
          ok: "var(--ok)", okbg: "var(--okbg)", warn: "var(--warn)", warnbg: "var(--warnbg)",
          neutral: "var(--neutral)", neutralbg: "var(--neutralbg)", bad: "var(--bad)", badbg: "var(--badbg)",
          staff: "var(--staff)", staffbg: "var(--staffbg)"
        },
        fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "Roboto", "sans-serif"] },
        borderRadius: { card: "12px" }
      }
    }
  };
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ---------------- Icons ---------------- */
const ICONS = {
  check: <path d="M20 6 9 17l-5-5" />,
  checkCircle: <><circle cx="12" cy="12" r="10" /><path d="m8.5 12.5 2.5 2.5 5-5.5" /></>,
  shield: <><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" /><path d="m9 12 2 2 4-4" /></>,
  phone: <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z" />,
  phoneOff: <><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91" /><path d="M22 2 2 22" /></>,
  clock: <><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></>,
  message: <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />,
  chevronDown: <path d="m6 9 6 6 6-6" />,
  x: <><path d="M18 6 6 18" /><path d="m6 6 12 12" /></>,
  inbox: <><path d="M22 12h-6l-2 3h-4l-2-3H2" /><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" /></>,
  calendar: <><rect x="3" y="4" width="18" height="18" rx="2" /><path d="M16 2v4" /><path d="M8 2v4" /><path d="M3 10h18" /></>,
  settings: <><path d="M4 21v-7" /><path d="M4 10V3" /><path d="M12 21v-9" /><path d="M12 8V3" /><path d="M20 21v-5" /><path d="M20 12V3" /><path d="M1 14h6" /><path d="M9 8h6" /><path d="M17 16h6" /></>,
  info: <><circle cx="12" cy="12" r="10" /><path d="M12 16v-4" /><path d="M12 8h.01" /></>,
  flag: <><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" /><path d="M4 22v-7" /></>,
  user: <><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" /><circle cx="12" cy="7" r="4" /></>,
  userCheck: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" /><circle cx="9" cy="7" r="4" /><path d="m16 11 2 2 4-4" /></>,
  sparkle: <path d="M12 3l1.9 5.8L20 10.7l-5.1 3.3L16.5 20 12 16.4 7.5 20l1.6-6-5.1-3.3 6.1-1.9z" />,
  arrowLeft: <><path d="m12 19-7-7 7-7" /><path d="M19 12H5" /></>,
  lock: <><rect x="3" y="11" width="18" height="11" rx="2" /><path d="M7 11V7a5 5 0 0 1 10 0v4" /></>,
  mapPin: <><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" /><circle cx="12" cy="10" r="3" /></>,
  tooth: <path d="M7 3c-2.2 0-4 1.8-4 4.3 0 2 .7 3.3 1.3 4.6.6 1.4.8 3 1 4.6.2 2 .8 4.5 2.2 4.5 1.3 0 1.6-2 1.9-3.6.3-1.4.8-2.4 2.6-2.4s2.3 1 2.6 2.4c.3 1.6.6 3.6 1.9 3.6 1.4 0 2-2.5 2.2-4.5.2-1.6.4-3.2 1-4.6.6-1.3 1.3-2.6 1.3-4.6C21 4.8 19.2 3 17 3c-1.7 0-2.9.9-5 .9S8.7 3 7 3z" />
};
function Icon({ name, className = "w-5 h-5", strokeWidth = 2 }) {
  return (
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={strokeWidth}
      strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
      {ICONS[name]}
    </svg>
  );
}

function Logo({ compact = false }) {
  return (
    <div className="flex items-center gap-2">
      <span className="grid place-items-center w-9 h-9 rounded-[10px] bg-brandsoft text-brandstrong">
        <Icon name="tooth" className="w-5 h-5" strokeWidth={1.8} />
      </span>
      {!compact && (
        <span className="text-[17px] font-semibold tracking-tight text-fg">
          Happy<span className="text-brandstrong">Smile</span>
        </span>
      )}
    </div>
  );
}

/* ---------------- Toasts ---------------- */
function useToasts() {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((text) => {
    const id = Math.random().toString(36).slice(2);
    setToasts((t) => [...t, { id, text }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
  }, []);
  return [toasts, push];
}
function Toasts({ toasts }) {
  return (
    <div aria-live="polite" role="status"
      className="fixed left-0 right-0 z-50 flex flex-col items-center gap-2 pointer-events-none gutter"
      style={{ bottom: "calc(20px + env(safe-area-inset-bottom, 0px))" }}>
      {toasts.map((t) => (
        <div key={t.id} className="fade-in pointer-events-auto flex items-center gap-2 rounded-card bg-fg text-bg px-4 py-3 text-sm font-medium shadow-phone max-w-full">
          <Icon name="checkCircle" className="w-4 h-4 shrink-0" />
          <span>{t.text}</span>
        </div>
      ))}
    </div>
  );
}

/* ---------------- Routing ---------------- */
function readRoute() { return (location.hash || "").replace("#", "") === "inbox" ? "inbox" : "patient"; }

function ViewToggle({ route, go }) {
  const item = (key, label) => {
    const active = route === key;
    return (
      <a href={key === "inbox" ? "#inbox" : "#"}
        onClick={(e) => { e.preventDefault(); go(key); }}
        aria-current={active ? "page" : undefined}
        className={"px-3.5 py-1.5 rounded-full text-[13px] font-medium transition-colors " +
          (active ? "bg-bg text-fg shadow-sm border border-line" : "text-muted hover:text-fg border border-transparent")}>
        {label}
      </a>
    );
  };
  return (
    <nav aria-label="Switch view" className="inline-flex items-center gap-0.5 p-1 rounded-full bg-surface2 border border-line">
      {item("patient", "Patient view")}
      {item("inbox", "Clinic view")}
    </nav>
  );
}

function PrototypeLabel() {
  return (
    <p className="text-xs text-muted flex items-center gap-1.5 justify-center">
      <span className="inline-block w-1.5 h-1.5 rounded-full bg-brand" aria-hidden="true"></span>
      Prototype - fictional scenario
    </p>
  );
}

/* ================= SCREEN 1: PATIENT ================= */
const SLOTS = ["Today, 6:30 pm", "Tomorrow, 10:00 am", "Tomorrow, 4:00 pm"];
const AI_NUMBER = "+91 80 4000 0000";
const CLINIC_NUMBER = "+91 80 4123 4567";

function PatientView({ route, go, toast }) {
  const [mode, setMode] = useState("confirm"); // confirm | calling | scheduled | whatsapp
  const [consent, setConsent] = useState(true);
  const [pickerOpen, setPickerOpen] = useState(false);
  const [slot, setSlot] = useState(null);
  const [secondsLeft, setSecondsLeft] = useState(120);
  const pickerRef = useRef(null);
  const headingRef = useRef(null);

  useEffect(() => {
    if (mode !== "calling") return;
    setSecondsLeft(120);
    const t = setInterval(() => setSecondsLeft((s) => (s > 0 ? s - 1 : 0)), 1000);
    return () => clearInterval(t);
  }, [mode]);

  useEffect(() => { headingRef.current && headingRef.current.focus(); }, [mode]);

  useEffect(() => {
    if (!pickerOpen) return;
    const onDoc = (e) => { if (pickerRef.current && !pickerRef.current.contains(e.target)) setPickerOpen(false); };
    const onKey = (e) => { if (e.key === "Escape") setPickerOpen(false); };
    document.addEventListener("mousedown", onDoc);
    document.addEventListener("keydown", onKey);
    return () => { document.removeEventListener("mousedown", onDoc); document.removeEventListener("keydown", onKey); };
  }, [pickerOpen]);

  const mm = Math.floor(secondsLeft / 60);
  const ss = String(secondsLeft % 60).padStart(2, "0");

  const btnBase = "w-full min-h-[56px] rounded-card px-5 text-[16px] font-semibold flex items-center justify-center gap-2 transition-colors disabled:opacity-45 disabled:cursor-not-allowed";

  return (
    <div className="min-h-full flex flex-col">
      <div className="gutter pt-4 flex justify-end">
        <ViewToggle route={route} go={go} />
      </div>

      <main className="flex-1 gutter py-6 sm:py-10 flex justify-center items-start">
        <div className="w-full max-w-[400px] rounded-[24px] border border-line bg-bg shadow-phone overflow-hidden">
          {/* Phone header */}
          <div className="flex items-center justify-between px-5 py-4 border-b border-line">
            <Logo />
            <span className="text-xs text-muted flex items-center gap-1"><Icon name="mapPin" className="w-3.5 h-3.5" />Bengaluru</span>
          </div>

          <div className="px-5 sm:px-6 pt-7 pb-6">
            {mode === "confirm" && (
              <div className="fade-in flex flex-col gap-6">
                <div className="flex flex-col items-center text-center gap-3">
                  <span className="grid place-items-center w-16 h-16 rounded-full bg-brandsoft text-brandstrong">
                    <Icon name="check" className="w-8 h-8" strokeWidth={2.5} />
                  </span>
                  <h1 ref={headingRef} tabIndex={-1} className="text-[26px] leading-tight font-semibold tracking-tight">Thanks, Priya!</h1>
                  <p className="text-[16px] leading-relaxed text-fg">
                    HappySmile's AI assistant will call you from <span className="font-semibold whitespace-nowrap tnum">{AI_NUMBER}</span> in about 2 minutes.
                  </p>
                </div>

                <p className="flex items-start gap-2.5 rounded-card bg-surface px-3.5 py-3 text-[14px] leading-snug text-muted">
                  <Icon name="shield" className="w-5 h-5 shrink-0 text-brandstrong mt-px" />
                  <span>It's an AI assistant. A HappySmile team member reviews every conversation.</span>
                </p>

                <div className="flex flex-col gap-2">
                  <p className="text-[11px] font-semibold uppercase tracking-[0.08em] text-muted">You asked about</p>
                  <ul className="flex flex-wrap gap-2" aria-label="Your enquiry">
                    {["Braces", "Indiranagar clinic", "This week"].map((c) => (
                      <li key={c} className="rounded-full border border-line bg-surface px-3 py-1.5 text-[14px] font-medium">{c}</li>
                    ))}
                  </ul>
                </div>

                <div className="flex flex-col gap-3">
                  <button type="button" disabled={!consent} aria-describedby="consent-text"
                    onClick={() => setMode("calling")}
                    className={btnBase + " bg-brandstrong text-onbrand hover:opacity-90"}>
                    <Icon name="phone" className="w-5 h-5" />Call me now
                  </button>

                  <div className="relative" ref={pickerRef}>
                    <button type="button" disabled={!consent} aria-haspopup="true" aria-expanded={pickerOpen}
                      aria-controls="slot-menu" onClick={() => setPickerOpen((o) => !o)}
                      className={btnBase + " bg-brandsoft text-brandstrong hover:bg-surface2"}>
                      <Icon name="clock" className="w-5 h-5" />Call me at...
                      <Icon name="chevronDown" className={"w-4 h-4 transition-transform " + (pickerOpen ? "rotate-180" : "")} />
                    </button>
                    {pickerOpen && (
                      <div id="slot-menu" role="group" aria-label="Pick a call time"
                        className="fade-in absolute z-20 left-0 right-0 mt-2 rounded-card border border-line bg-bg shadow-phone p-1.5">
                        <p className="px-3 pt-2 pb-1 text-xs text-muted">Pick a time and we'll call you then</p>
                        {SLOTS.map((s) => (
                          <button key={s} type="button"
                            onClick={() => { setSlot(s); setPickerOpen(false); setMode("scheduled"); }}
                            className="w-full min-h-[48px] text-left px-3 rounded-[8px] text-[15px] font-medium hover:bg-surface flex items-center justify-between">
                            {s}<Icon name="phone" className="w-4 h-4 text-muted" />
                          </button>
                        ))}
                      </div>
                    )}
                  </div>

                  <button type="button" disabled={!consent} onClick={() => setMode("whatsapp")}
                    className={btnBase + " border-2 border-line text-fg hover:bg-surface"}>
                    <Icon name="message" className="w-5 h-5" />WhatsApp me instead
                  </button>
                </div>

                <div className="flex items-start gap-3">
                  <input id="consent" type="checkbox" checked={consent} onChange={(e) => setConsent(e.target.checked)}
                    className="mt-0.5 w-5 h-5 shrink-0 rounded accent-[var(--brandstrong)] cursor-pointer" />
                  <label htmlFor="consent" id="consent-text" className="text-[13px] leading-snug text-muted cursor-pointer">
                    I agree to be contacted by HappySmile by phone or WhatsApp about my enquiry. You can stop this anytime.{" "}
                    <a href="#" onClick={(e) => { e.preventDefault(); toast("The privacy policy isn't part of this prototype"); }}
                      className="font-medium text-brandstrong underline underline-offset-2">Privacy</a>
                  </label>
                </div>
                {!consent && (
                  <p className="-mt-3 text-[13px] text-warn font-medium">Tick the box above so we can contact you.</p>
                )}
              </div>
            )}

            {mode === "calling" && (
              <div className="fade-in flex flex-col items-center text-center gap-5 py-4" aria-live="polite">
                <span className="ringer grid place-items-center w-24 h-24 rounded-full my-3">
                  <span className="relative z-10 grid place-items-center w-24 h-24 rounded-full bg-brandstrong text-onbrand">
                    <Icon name="phone" className="w-10 h-10" />
                  </span>
                </span>
                <div className="flex flex-col gap-1.5">
                  <h1 ref={headingRef} tabIndex={-1} className="text-[24px] font-semibold tracking-tight">Calling you now...</h1>
                  <p className="text-[15px] text-muted">From <span className="font-semibold text-fg tnum">{AI_NUMBER}</span></p>
                </div>
                <div className="w-full rounded-card bg-surface px-4 py-4 flex flex-col gap-2">
                  <p className="text-[15px] font-medium">about 2 minutes</p>
                  <div className="h-1.5 rounded-full bg-surface2 overflow-hidden" aria-hidden="true">
                    <div className="h-full bg-brand transition-[width] duration-1000 ease-linear"
                      style={{ width: ((120 - secondsLeft) / 120) * 100 + "%" }}></div>
                  </div>
                  <p className="text-[13px] text-muted tnum">
                    {secondsLeft > 0 ? `Expected in ${mm}:${ss}` : "Your phone should ring any moment."}
                  </p>
                </div>
                <p className="flex items-start gap-2 text-left text-[13px] text-muted">
                  <Icon name="shield" className="w-4 h-4 shrink-0 text-brandstrong mt-0.5" />
                  The assistant will tell you it's an AI. You can ask for a person at any point in the call.
                </p>
                <div className="w-full flex flex-col gap-2">
                  <button type="button" onClick={() => { setMode("confirm"); setPickerOpen(true); }}
                    className={btnBase + " border-2 border-line text-fg hover:bg-surface"}>
                    <Icon name="clock" className="w-5 h-5" />Call me at a different time
                  </button>
                  <button type="button" onClick={() => { setMode("confirm"); toast("Call cancelled. We won't call you now."); }}
                    className="min-h-[48px] text-[15px] font-medium text-muted hover:text-fg underline underline-offset-2">
                    Cancel the call
                  </button>
                </div>
              </div>
            )}

            {mode === "scheduled" && (
              <div className="fade-in flex flex-col items-center text-center gap-5 py-4">
                <span className="grid place-items-center w-20 h-20 rounded-full bg-brandsoft text-brandstrong my-2">
                  <Icon name="calendar" className="w-9 h-9" />
                </span>
                <div className="flex flex-col gap-1.5">
                  <h1 ref={headingRef} tabIndex={-1} className="text-[24px] font-semibold tracking-tight">We'll call you {slot}</h1>
                  <p className="text-[15px] text-muted">From <span className="font-semibold text-fg tnum">{AI_NUMBER}</span>. We'll send a WhatsApp reminder 15 minutes before.</p>
                </div>
                <div className="w-full flex flex-col gap-3">
                  <button type="button" onClick={() => setMode("calling")} className={btnBase + " bg-brandstrong text-onbrand hover:opacity-90"}>
                    <Icon name="phone" className="w-5 h-5" />Call me now instead
                  </button>

function useIsDesktop() {
  const q = "(min-width: 1024px)";
  const [is, setIs] = useState(() => window.matchMedia(q).matches);
  useEffect(() => {
    const m = window.matchMedia(q);
    const f = () => setIs(m.matches);
    m.addEventListener ? m.addEventListener("change", f) : m.addListener(f);
    return () => { m.removeEventListener ? m.removeEventListener("change", f) : m.removeListener(f); };
  }, []);
  return is;
}

    return () => document.removeEventListener("keydown", onKey);
  }, []);

  const update = (id, patch) => setLeads((ls) => ls.map((l) => (l.id === id ? { ...l, ...patch } : l)));
  const takeOver = (id) => { update(id, { status: "staff" }); toast("You now own this lead"); };
  const humanOnly = (id) => { update(id, { humanOnly: true }); toast("Future contact will be human-only"); };
  const book = () => toast("The booking calendar isn't part of this prototype");

  const navItems = [["inbox", "Inbox"], ["calendar", "Calendar"], ["settings", "Settings"]];
  const navClick = (key) => { if (key !== "inbox") toast(`${key === "calendar" ? "Calendar" : "Settings"} isn't part of this prototype`); };

  const showOverlay = !isDesktop && selected;

  return (
    <div className="min-h-full flex bg-bg">
      {/* Sidebar */}
      <aside className="hidden md:flex w-[232px] shrink-0 flex-col border-r border-line bg-surface sticky top-0 h-screen"
        style={{ paddingLeft: "env(safe-area-inset-left, 0px)" }}>
        <div className="px-5 py-5"><Logo /></div>
        <nav aria-label="Main" className="px-3 flex flex-col gap-1">
          {navItems.map(([key, label]) => {
            const active = key === "inbox";
            return (
              <a key={key} href={active ? "#inbox" : "#inbox"} onClick={(e) => { e.preventDefault(); navClick(key); }}
                aria-current={active ? "page" : undefined}
                className={"flex items-center gap-3 px-3 min-h-[40px] rounded-[10px] text-[14px] font-medium " +
                  (active ? "bg-bg text-fg border border-line shadow-sm" : "text-muted hover:text-fg hover:bg-surface2 border border-transparent")}>
                <Icon name={key} className="w-[18px] h-[18px]" />{label}
                {active && <span className="ml-auto text-xs font-semibold text-bad bg-badbg rounded-full px-2 py-0.5 tnum">{leads.filter((l) => l.status === "flagged" || l.status === "needs").length}</span>}
              </a>
            );
          })}
        </nav>
        <div className="mt-auto px-5 py-5 border-t border-line flex items-center gap-3">
          <span className="grid place-items-center w-9 h-9 rounded-full bg-brandsoft text-brandstrong text-[13px] font-semibold">DR</span>
          <div className="min-w-0">
            <p className="text-[14px] font-medium">Deepa Rao</p>
            <p className="text-xs text-muted">Front desk lead</p>
          </div>
        </div>
      </aside>

      {/* Main */}
      <div className="flex-1 min-w-0 flex flex-col">
        <div className="gutter pt-4 flex items-center justify-between md:justify-end gap-3">
          <div className="md:hidden"><Logo /></div>
          <ViewToggle route={route} go={go} />
        </div>
        <nav aria-label="Main" className="md:hidden gutter pt-3 flex gap-1 overflow-x-auto">
          {navItems.map(([key, label]) => (
            <a key={key} href="#inbox" onClick={(e) => { e.preventDefault(); navClick(key); }}
              aria-current={key === "inbox" ? "page" : undefined}
              className={"flex items-center gap-2 px-3 min-h-[40px] rounded-full text-[14px] font-medium whitespace-nowrap " +
                (key === "inbox" ? "bg-surface2 text-fg" : "text-muted")}>
              <Icon name={key} className="w-4 h-4" />{label}
            </a>
          ))}
        </nav>

        <header className="gutter pt-5 pb-5 flex flex-col gap-5">
          <div className="flex flex-wrap items-end justify-between gap-3">
            <div>
              <h1 className="text-[26px] font-semibold tracking-tight">Today's enquiries</h1>
              <p className="text-[14px] text-muted tnum">Updated 6:45 pm · all times IST</p>
            </div>
            <div className="relative">
              <label htmlFor="clinic-filter" className="sr-only">Clinic</label>
              <select id="clinic-filter" value={clinic} onChange={(e) => setClinic(e.target.value)}
                className="appearance-none min-h-[42px] rounded-card border border-line bg-bg text-fg text-[14px] font-medium pl-9 pr-10 cursor-pointer hover:bg-surface">
                <option value="all">Pilot clinics (3)</option>
                <option value="Indiranagar">Indiranagar</option>
                <option value="Koramangala">Koramangala</option>
                <option value="Whitefield">Whitefield</option>
              </select>
              <span className="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-muted"><Icon name="mapPin" className="w-4 h-4" /></span>
              <span className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-muted"><Icon name="chevronDown" className="w-4 h-4" /></span>
            </div>
          </div>

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <StatCard label="New today" value={stats.new} caption={clinic === "all" ? "Across 3 pilot clinics since 8 am" : `${clinic} since 8 am`} icon="inbox" tone="bg-brandsoft text-brandstrong" />
            <StatCard label="Booked" value={stats.booked} caption="Confirmed by WhatsApp" icon="checkCircle" tone="bg-okbg text-ok" />
            <StatCard label="Needs a human" value={stats.needs} caption="Waiting for the front desk" icon="user" tone="bg-warnbg text-warn" />
            <StatCard label="Not reached" value={stats.notreached} caption="WhatsApp follow-up sent" icon="phoneOff" tone="bg-neutralbg text-neutral" />
          </div>
        </header>

        <div className="gutter pb-6 flex gap-5 items-start flex-1">
          {/* List */}
          <section aria-label="Lead list" className="flex-1 min-w-0 flex flex-col gap-3">
            <p className="flex items-start gap-2.5 rounded-card bg-brandsoft px-4 py-3 text-[14px] text-fg">
              <Icon name="info" className="w-[18px] h-[18px] shrink-0 text-brandstrong mt-px" />
              Every conversation is visible here. You can take over any lead at any time.
            </p>

            <div className="overflow-x-auto -mx-1 px-1">
              <div role="group" aria-label="Filter by status" className="flex gap-1.5 min-w-max py-1">
                {TABS.map((t) => {
                  const active = tab === t.key;
                  return (
                    <button key={t.key} type="button" aria-pressed={active} onClick={() => setTab(t.key)}
                      className={"min-h-[38px] px-3.5 rounded-full text-[14px] font-medium border flex items-center gap-2 " +
                        (active ? "bg-fg text-bg border-fg" : "bg-bg text-muted border-line hover:text-fg hover:bg-surface")}>
                      {t.label}
                      <span className={"text-xs tnum rounded-full px-1.5 py-px " + (active ? "bg-bg/20" : "bg-surface2")}>{count(t.key)}</span>
                    </button>
                  );
                })}
              </div>
            </div>

            {visible.length ? (
              <ul className="flex flex-col gap-2">
                {visible.map((l) => <LeadRow key={l.id} lead={l} selected={l.id === selectedId} onSelect={setSelectedId} />)}
              </ul>
            ) : (
              <div className="rounded-card border border-dashed border-line p-8 text-center text-[14px] text-muted">
                No enquiries match these filters. Try another clinic or status.
              </div>
            )}
            <p className="text-xs text-muted">Showing {visible.length} sample leads from today's {stats.new} enquiries.</p>
          </section>

          {/* Detail panel: inline on desktop */}
          {isDesktop && (
            <aside aria-label="Lead details"
              className="w-[420px] shrink-0 sticky top-4 h-[calc(100vh-2rem)] rounded-card border border-line bg-bg overflow-hidden">
              <LeadDetail key={selected ? selected.id : "none"} lead={selected} onClose={() => setSelectedId(null)}
                onTakeOver={takeOver} onHumanOnly={humanOnly} onBook={book} isOverlay={false} />
            </aside>
          )}
        </div>

        <footer className="gutter pb-6 pt-2"><PrototypeLabel /></footer>
      </div>

      {/* Detail panel: overlay sheet on smaller screens */}
      {showOverlay && (
        <div className="fixed inset-0 z-40">
          <div className="absolute inset-0 bg-black/40" onClick={() => setSelectedId(null)} aria-hidden="true"></div>
          <aside role="dialog" aria-modal="true" aria-label={`Details for ${selected.name}`}
            className="slide-in absolute right-0 top-0 bottom-0 w-full sm:w-[440px] bg-bg border-l border-line flex flex-col"
            style={{ paddingTop: "env(safe-area-inset-top, 0px)", paddingRight: "env(safe-area-inset-right, 0px)" }}>
            <LeadDetail lead={selected} onClose={() => setSelectedId(null)}
              onTakeOver={takeOver} onHumanOnly={humanOnly} onBook={book} isOverlay={true} />
          </aside>
        </div>
      )}
    </div>
  );
}

/* ---------------- App ---------------- */
function App() {
  const [route, setRoute] = useState(readRoute);
  const [toasts, toast] = useToasts();
  useEffect(() => {
    const f = () => { setRoute(readRoute()); window.scrollTo(0, 0); };
    window.addEventListener("hashchange", f);
    return () => window.removeEventListener("hashchange", f);
  }, []);
  const go = (key) => {
    setRoute(key);
    try { location.hash = key === "inbox" ? "inbox" : ""; } catch (e) {}
  };
  return (
    <>
      {route === "inbox"
        ? <InboxView route={route} go={go} toast={toast} />
        : <PatientView route={route} go={go} toast={toast} />}
      <Toasts toasts={toasts} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
